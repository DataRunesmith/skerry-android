# The documentation site: `zensical build` renders docs/ into site/, which
# .github/workflows/pages.yml publishes. No site_url is set, so the build does
# not depend on the address it is served from.
[project]
site_name = "Skerry for Android"
site_description = "An SSH and host-management app for Android, written in Kotlin."
repo_url = "https://github.com/DataRunesmith/skerry-android"
nav = [
  { "Home" = "index.md" },
  { "Get started" = "getting-started.md" },
]
extra_css = ["stylesheets/extra.css"]

[project.extra]
platform = "Android"
tagline = "An SSH and host-management app for Android, written in Kotlin."

[project.theme]
custom_dir = "overrides"
logo = "assets/skerry.svg"
favicon = "assets/skerry.svg"
font = false
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
