name: Docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - run: pip install --no-deps -r requirements-docs.txt
      - name: Set repository URL
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from jinja2 import StrictUndefined, Template

          config = Path("zensical.toml")
          config.write_text(
              config.read_text().replace("{repository}", os.environ["REPOSITORY"])
          )
          index = Path("docs/index.md")
          index.write_text(Template(index.read_text(), undefined=StrictUndefined).render(
              config=tomllib.loads(config.read_text())["project"]
          ) + "\n")
          PY
      - run: zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
